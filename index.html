<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RPG1</title>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>
</head>

<body>

<h1>RPG1</h1>

<pre id="screen">Python 불러오는 중...</pre>

<script>

const screen = document.getElementById("screen");

async function main() {

    const pyodide = await loadPyodide();

    screen.textContent = "";

    // print() 출력
    pyodide.setStdout({
        batched: (text) => {
            screen.textContent += text + "\n";
        }
    });

    // 에러 출력
    pyodide.setStderr({
        batched: (text) => {
            screen.textContent += text + "\n";
        }
    });

    // Safari 팝업을 Python에서 쓸 수 있게 넘겨줌
    pyodide.globals.set("browser_prompt", (text) => {
        return window.prompt(text);
    });

    // game.py 읽기
    const response = await fetch("game.py");

    if (!response.ok) {
        screen.textContent += "game.py를 불러오지 못했습니다.\n";
        return;
    }

    const gameCode = await response.text();

    // Python 기본 input()만 웹용으로 교체
    const wrapper = `
import builtins
import js

def web_input(prompt=""):
    value = js.browser_prompt(prompt)

    if value is None:
        raise EOFError("입력이 취소되었습니다.")

    return str(value)

builtins.input = web_input

${gameCode}
`;

    // 네 game.py 실행
    await pyodide.runPythonAsync(wrapper);
}

main();

</script>

</body>

</html>
