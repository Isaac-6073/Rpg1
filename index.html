<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RPG1</title>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>
</head>

<body>

<h1>RPG1</h1>

<pre id="screen">Python 불러오는 중...</pre>

<script>

const screen = document.getElementById("screen");

async function main() {

    // Python 실행기 불러오기
    const pyodide = await loadPyodide();

    screen.textContent = "";

    // print() 결과를 화면에 표시
    pyodide.setStdout({
        batched: (text) => {
            screen.textContent += text + "\n";
        }
    });

    // 에러도 화면에 표시
    pyodide.setStderr({
        batched: (text) => {
            screen.textContent += text + "\n";
        }
    });

    // Python의 input()을 브라우저 팝업 입력과 연결
    pyodide.setStdin({
        stdin: () => {
            const value = window.prompt("게임 입력");
            return value;
        }
    });

    // 같은 폴더의 game.py 읽기
    const response = await fetch("game.py");
    const code = await response.text();

    // game.py 실행
    await pyodide.runPythonAsync(code);
}

main();

</script>

</body>
</html>
