<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RPG1</title>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>
</head>

<body>

<h1>RPG1</h1>

<pre id="screen">Python 불러오는 중...</pre>

<script>

const screen = document.getElementById("screen");

async function main() {

    // 브라우저에서 Python 실행기 불러오기
    const pyodide = await loadPyodide();

    screen.textContent = "";

    // Python의 print()와 input() 안내문을
    // 웹페이지에 그대로 출력
    pyodide.setStdout({
        raw: (byte) => {
            screen.textContent += String.fromCharCode(byte);
        }
    });

    // Python 에러도 웹페이지에 출력
    pyodide.setStderr({
        raw: (byte) => {
            screen.textContent += String.fromCharCode(byte);
        }
    });

    // Python의 input()이 실행되면
    // Safari 입력 팝업을 띄움
    pyodide.setStdin({
        stdin: () => {
            const value = window.prompt("입력하세요");
            return value;
        }
    });

    // 같은 GitHub 폴더에 있는 game.py를 읽음
    const response = await fetch("game.py");

    if (!response.ok) {
        screen.textContent +=
            "\ngame.py를 불러오지 못했습니다.\n";
        return;
    }

    const code = await response.text();

    // 네 game.py를 그대로 실행
    await pyodide.runPythonAsync(code);
}

main();

</script>

</body>

</html>
